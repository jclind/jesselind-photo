name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          # package.json pins engines.node to >=24.
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Typecheck
        run: npx tsc --noEmit

      # `next build` prerenders /admin, which calls getAuth() at module scope
      # and throws auth/invalid-api-key when the key is missing, and the
      # app/sitemap.ts route reads the real `photos` collection during the
      # build — a denied read fails the build instead of publishing an empty
      # sitemap. So this job needs the real values. They are NEXT_PUBLIC_
      # values that ship to every visitor's browser anyway, so committing
      # them buys no new exposure.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyDxAS1-UAtj7Rv42-pUsWFbUOG8UkjqHtg
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: photography-website-e62a9.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: photography-website-e62a9
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: photography-website-e62a9.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '984875779918'
          NEXT_PUBLIC_FIREBASE_APP_ID: '1:984875779918:web:63ef0c6485b3e31d4d401f'
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-G4SQVX634K
